services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langchain-streamlit-dev
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Define POSTGRES_USER en .env}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@postgres:5432/${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      pgadmin:
        condition: service_started
    command: sleep infinity
    networks:
      - postgres_network

  postgres:
    image: postgres:16
    container_name: langchain-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_langchain_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - postgres_network

  pgadmin:
    image: dpage/pgadmin4:9.19
    container_name: langchain-pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Define PGADMIN_DEFAULT_EMAIL en .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Define PGADMIN_DEFAULT_PASSWORD en .env}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    configs:
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres_network

configs:
  pgadmin_servers:
    content: ${PGADMIN_SERVERS_JSON:?Define PGADMIN_SERVERS_JSON en .env}

volumes:
  postgres_langchain_data:
  pgadmin_data:

networks:
  postgres_network:
    driver: bridge
